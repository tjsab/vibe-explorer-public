<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Explorer</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    #info {
      position: absolute;
      top: 16px;
      left: 16px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 12px 16px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    #info h1 { margin: 0 0 4px 0; font-size: 18px; }
    #info p { margin: 0; font-size: 14px; opacity: 0.9; }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    button {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    button:hover { background: rgba(255,255,255,0.25); }
  </style>
</head>
<body>
  <div id="info">
    <h1>Vibe Explorer</h1>
    <p id="name">Joining...</p>
  </div>
  <div id="controls">
    <button onclick="sayHello()">✨ Greet</button>
    <button onclick="startSinging()">🎵 Sing</button>
    <button onclick="dance()">💃 Dance</button>
    <button onclick="pray()">🙏 Pray / Bhakti</button>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
